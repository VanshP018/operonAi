services:
  - type: web
    name: operonai-app
    runtime: node
    plan: starter
    startCommand: npm start
    buildCommand: bash build.sh
    envVars:
      - key: MONGO_URI
        value: ${DATABASE_URL}
      - key: STRIPE_SECRET_KEY
        fromEnvVarName: STRIPE_SECRET_KEY
      - key: GEMINI_API_KEY
        fromEnvVarName: GEMINI_API_KEY
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://${RENDER_SERVICE_NAME}.onrender.com



